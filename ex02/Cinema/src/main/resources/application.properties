# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/new_cinema
spring.datasource.username=postgres
spring.datasource.password=le_mot_de_passe
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Schema is hand-written in schema.sql (see Rules of the project) - Hibernate only
# validates that entity mappings match it, it never generates or alters the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Freemarker
spring.freemarker.suffix=.ftl
spring.freemarker.template-loader-path=classpath:/templates/

# File uploads (used by FileStorageService)
upload.dir=votre_chemin
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Used to build the /confirm/{token} link sent in the confirmation email.
# Change this if you deploy anywhere other than local dev.
app.base-url=http://localhost:8080

# Mail (used by EmailService for account confirmation)
# Use a Gmail App Password here, NOT your real Gmail account password -
# Gmail requires 2FA to be enabled and an app password generated at
# https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com