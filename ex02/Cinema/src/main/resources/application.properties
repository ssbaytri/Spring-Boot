# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/new_cinema
spring.datasource.username=postgres
spring.datasource.password=le_mot_de_passe
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Schema is hand-written in schema.sql (see Rules of the project) - Hibernate only
# validates that entity mappings match it, it never generates or alters the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Freemarker
spring.freemarker.suffix=.ftl
spring.freemarker.template-loader-path=classpath:/templates/

# File uploads (used by FileStorageService)
upload.dir=votre_chemin
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB